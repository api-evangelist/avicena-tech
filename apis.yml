aid: avicena-tech
name: Avicena Tech
description: 'Avicena Tech Corp. is a privately held semiconductor company founded
  in 2019 and headquartered in Sunnyvale, California, with a subsidiary in Edinburgh,
  Scotland. Avicena develops LightBundle, a microLED-based optical interconnect architecture
  for chip-to-chip, die-to-die and rack-scale links in AI/ML training clusters, high-performance
  computing, memory disaggregation, sensors, 5G wireless and aerospace. The technology
  pairs patented microLED emitter arrays with photodetector arrays and an integrated
  ASIC, supporting greater than 1Tbps/mm shoreline density at sub-picojoule-per-bit
  energy efficiency over reaches beyond 10 meters. The company ships a LightBundle
  eKit evaluation system to AI infrastructure customers and is backed by Tiger Global,
  SK hynix, Samsung Catalyst Fund, Micron Ventures, Clear Ventures, Cerberus Capital
  Management, Hitachi Ventures, LAM Research, Maverick Silicon, Prosperity7 Ventures
  and VentureTech Alliance. Avicena is a hardware and photonics company: it publishes
  no public developer program, API, SDK or machine-readable specification.'
